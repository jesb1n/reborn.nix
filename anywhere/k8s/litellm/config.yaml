# litellm proxy config.yaml — mounted as a ConfigMap via configMapGenerator.
# Contains NO secrets; credentials come from the litellm-secret (SOPS) via envFrom.
model_list:
  - model_name: chatgpt-sol
    model_info:
      mode: responses
      max_input_tokens: 1050000
      max_output_tokens: 128000
    litellm_params:
      model: chatgpt/gpt-5.6-sol
      chatgpt_auth_file_path: /data/chatgpt/auth.json
  - model_name: chatgpt-codex
    model_info:
      mode: responses
      max_input_tokens: 400000
      max_output_tokens: 64000
    litellm_params:
      model: chatgpt/gpt-5.4
      chatgpt_auth_file_path: /data/chatgpt/auth.json
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
  - model_name: agentrouter-gpt-5.6
    model_info:
      mode: responses
    litellm_params:
      model: openai/gpt-5.6
      api_base: https://agentrouter.org/v1
      api_key: os.environ/AGENTROUTER_API_KEY
  - model_name: agentrouter-gpt-5.5
    model_info:
      mode: responses
    litellm_params:
      model: openai/gpt-5.5
      api_base: https://agentrouter.org/v1
      api_key: os.environ/AGENTROUTER_API_KEY
  - model_name: agentrouter-glm-5.2
    model_info:
      mode: responses
    litellm_params:
      model: openai/glm-5.2
      api_base: https://agentrouter.org/v1
      api_key: os.environ/AGENTROUTER_API_KEY
  - model_name: agentrouter-opus
    litellm_params:
      model: anthropic/claude-opus-4-6
      api_base: https://agentrouter.org
      api_key: os.environ/AGENTROUTER_API_KEY
  - model_name: agentrouter-opus-4.7
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_base: https://agentrouter.org
      api_key: os.environ/AGENTROUTER_API_KEY
  - model_name: agentrouter-opus-4.8
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_base: https://agentrouter.org
      api_key: os.environ/AGENTROUTER_API_KEY

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  salt_key: os.environ/LITELLM_SALT_KEY
