apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: litellm-config
    namespace: litellm
    files:
      - config.yaml
    options:
      disableNameSuffixHash: true
  - name: litellm-patch
    namespace: litellm
    files:
      - sitecustomize.py
    options:
      disableNameSuffixHash: true