commonLabels:
  garage.cluster: migration
  garage.generation: old

garage:
  existingRpcSecret: garage-rpc-secret
  replicationFactor: "3"
  consistencyMode: consistent
  compressionLevel: "1"
  metadataAutoSnapshotInterval: "6h"

deployment:
  kind: StatefulSet
  replicaCount: 4
  podManagementPolicy: Parallel

image:
  repository: dxflrs/garage
  pullPolicy: IfNotPresent

persistence:
  enabled: true
  meta:
    size: 1Gi
  data:
    size: 30Gi

resources:
  requests:
    memory: 64Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 500m

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values:
                - rpi
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: garage
          topologyKey: kubernetes.io/hostname

service:
  type: ClusterIP
  s3:
    api:
      port: 3900
    web:
      port: 3902

ingress:
  s3:
    api:
      enabled: false
    web:
      enabled: false
