apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniroute
  namespace: omniroute
  labels:
    app.kubernetes.io/name: omniroute
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: omniroute
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omniroute
    spec:
      nodeSelector:
        kubernetes.io/hostname: nuc7i3
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: omniroute
          image: diegosouzapw/omniroute:3.8.49-web
          imagePullPolicy: IfNotPresent
          ports:
            - name: dashboard
              containerPort: 20128
            - name: api
              containerPort: 20129
            - name: live-ws
              containerPort: 20132
          env:
            - name: DATA_DIR
              value: /app/data
            - name: PORT
              value: "20128"
            - name: DASHBOARD_PORT
              value: "20128"
            - name: API_PORT
              value: "20129"
            - name: API_HOST
              value: 0.0.0.0
            - name: LIVE_WS_PORT
              value: "20132"
            - name: LIVE_WS_HOST
              value: 0.0.0.0
            - name: LIVE_WS_ALLOWED_ORIGINS
              value: http://100.119.33.56:32128
            - name: NEXT_PUBLIC_LIVE_WS_PUBLIC_URL
              value: ws://100.119.33.56:32132/live-ws
            - name: REDIS_URL
              value: redis://redis:6379
            - name: OMNIROUTE_MEMORY_MB
              value: "2048"
          envFrom:
            - secretRef:
                name: omniroute-secret
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "15"]
          startupProbe:
            httpGet:
              path: /healthz
              port: dashboard
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: dashboard
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: dashboard
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: omniroute-data
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
