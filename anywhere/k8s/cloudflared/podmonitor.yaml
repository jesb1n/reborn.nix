# Scrape cloudflared's built-in Prometheus endpoint (--metrics 0.0.0.0:2000).
# Probes already use /ready on the same listener; /metrics is the scrape path.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app: cloudflared
spec:
  selector:
    matchLabels:
      app: cloudflared
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: 30s
